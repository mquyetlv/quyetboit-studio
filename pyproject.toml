[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quyetboit-studio"
version = "0.2.0"
description = "Desktop pipeline tạo video VietSub từ Douyin"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "google-genai>=2",
    "httpx>=0.28",
    "keyring>=25",
    "numpy>=2",
    "pydantic>=2",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
quyetboit-studio = "quyetboit_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
